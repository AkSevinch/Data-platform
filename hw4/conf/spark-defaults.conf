spark.master yarn
spark.submit.deployMode client
spark.app.name sevinch-hw4-sales-summary

spark.yarn.archive hdfs://team-02-nn:21020/user/dpe_sevinch/spark/spark-libs.zip
spark.yarn.stagingDir hdfs://team-02-nn:21020/user/dpe_sevinch/spark/staging
spark.yarn.maxAppAttempts 1

spark.sql.catalogImplementation hive
spark.sql.warehouse.dir hdfs://team-02-nn:21020/user/dpe_sevinch/hive/warehouse
spark.sql.shuffle.partitions 2
spark.sql.sources.partitionOverwriteMode dynamic
spark.sql.adaptive.enabled false
spark.sql.parquet.compression.codec snappy

spark.hadoop.fs.defaultFS hdfs://team-02-nn:21020
spark.hadoop.hive.metastore.uris thrift://__HIVE_HOST__:21053
spark.hadoop.hive.metastore.schema.verification false
spark.hadoop.hive.metastore.schema.verification.record.version false
spark.hadoop.hive.metastore.event.db.notification.api.auth false
spark.hadoop.hive.metastore.warehouse.dir hdfs://team-02-nn:21020/user/dpe_sevinch/hive/warehouse

spark.driver.memory 512m
spark.driver.memoryOverhead 256
spark.driver.extraClassPath /srv/dpe/sevinch/conf/hw4
spark.yarn.am.memory 512m
spark.yarn.am.memoryOverhead 256

spark.executor.memory 512m
spark.executor.memoryOverhead 256
spark.executor.cores 1
spark.executor.instances 1
spark.dynamicAllocation.enabled false

spark.ui.enabled true
spark.ui.port 21404
spark.eventLog.enabled false
